<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .floating-card {
      transform-box: fill-box;
      transform-origin: center;
    }
    
    /* Dynamic pulsing & flowing animations strictly kept in background/periphery */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -80; }
    }
    @keyframes badgeBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    .orb-1 { animation: floatOrb1 8s ease-in-out infinite, pulseGlow 6s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 9s ease-in-out infinite, pulseGlow 7s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashStream 3s linear infinite;
    }
    .bob-1 { animation: badgeBob 4s ease-in-out infinite; }
    .bob-2 { animation: badgeBob 4.6s ease-in-out infinite 0.6s; }
    .bob-3 { animation: badgeBob 4.2s ease-in-out infinite 1.2s; }
    .bob-4 { animation: badgeBob 5s ease-in-out infinite 1.8s; }
  ]]></style>

  <!-- Dark Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Nebulas in Background Layer -->
  <g opacity="0.4">
    <circle class="orb-1" cx="200" cy="90" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="270" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle class="orb-1" cx="900" cy="70" r="120" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Overlay for Homelab Vibe -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Data Packet Stream Lines (Lower Background) -->
  <g opacity="0.35" fill="none">
    <path class="stream-line" d="M 60 40 Q 250 160 500 40 T 1140 100" stroke="#38bdf8" stroke-width="2.5" />
    <path class="stream-line" d="M 40 320 Q 350 200 700 320 T 1160 260" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Decorative Outer Frame Border -->
  <rect x="10" y="10" width="1180" height="340" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Foreground Content Area: Guaranteed Clean Readability -->
  
  <!-- Top Category Tag -->
  <g transform="translate(60, 48)">
    <rect width="265" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#22c55e" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">CURATED HOMELAB ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text class="title-text" x="60" y="125">
    Awesome Media Automation
  </text>
  <text class="title-text" x="60" y="175" fill="url(#primaryGlow)">
    &amp; Home Server Management
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="60" y="218">
    The definitive guide to *Arr pipelines, private cloud streaming, and self-hosted orchestration.
  </text>

  <!-- Interactive/Dynamic Feature Pills (Anchored at Bottom Row) -->
  <g transform="translate(60, 260)">
    <!-- Pill 1: *Arr Suite -->
    <g class="bob-1" transform="translate(0, 0)">
      <rect width="170" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#38bdf8" />
      <text class="pill-text" x="38" y="26">⚡ Sonarr &amp; Radarr</text>
    </g>

    <!-- Pill 2: Media Servers -->
    <g class="bob-2" transform="translate(185, 0)">
      <rect width="185" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#a855f7" />
      <text class="pill-text" x="38" y="26">🎬 Jellyfin &amp; Plex</text>
    </g>

    <!-- Pill 3: Request Portals -->
    <g class="bob-3" transform="translate(385, 0)">
      <rect width="170" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#ec4899" />
      <text class="pill-text" x="38" y="26">📬 Seerr &amp; Ombi</text>
    </g>

    <!-- Pill 4: Torrents & Indexers -->
    <g class="bob-4" transform="translate(570, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#10b981" />
      <text class="pill-text" x="38" y="26">🚀 Prowlarr &amp; qBit</text>
    </g>

    <!-- Pill 5: Subtitles & Automation -->
    <g class="bob-1" transform="translate(780, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#f59e0b" />
      <text class="pill-text" x="38" y="26">💬 Bazarr &amp; Autobrr</text>
    </g>
  </g>

  <!-- Right Side Decorative Hardware Server Icon Cluster -->
  <g transform="translate(1005, 55)" opacity="0.85">
    <!-- Server Stack Unit 1 -->
    <g class="bob-2">
      <rect x="0" y="0" width="135" height="34" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="17" r="4" fill="#22c55e" />
      <circle cx="28" cy="17" r="4" fill="#38bdf8" />
      <rect x="42" y="15" width="45" height="4" rx="2" fill="rgba(255,255,255,0.25)" />
      <rect x="98" y="13" width="22" height="8" rx="2" fill="rgba(56, 189, 248, 0.2)" />
    </g>

    <!-- Server Stack Unit 2 -->
    <g class="bob-3">
      <rect x="0" y="44" width="135" height="34" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="61" r="4" fill="#22c55e" />
      <circle cx="28" cy="61" r="4" fill="#a855f7" />
      <rect x="42" y="59" width="45" height="4" rx="2" fill="rgba(255,255,255,0.25)" />
      <rect x="98" y="57" width="22" height="8" rx="2" fill="rgba(168, 85, 247, 0.2)" />
    </g>

    <!-- Server Stack Unit 3 -->
    <g class="bob-1">
      <rect x="0" y="88" width="135" height="34" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="105" r="4" fill="#22c55e" />
      <circle cx="28" cy="105" r="4" fill="#ec4899" />
      <rect x="42" y="103" width="45" height="4" rx="2" fill="rgba(255,255,255,0.25)" />
      <rect x="98" y="101" width="22" height="8" rx="2" fill="rgba(236, 72, 153, 0.2)" />
    </g>
  </g>
</svg>
